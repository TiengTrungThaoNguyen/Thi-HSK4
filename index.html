  body.examMode::before{
    background-image:linear-gradient(135deg,var(--pink-bg1),var(--pink-bg2));
  }
  .wrap{max-width:820px; margin:0 auto; padding:20px 14px 60px;}
  .brand{text-align:center; margin-bottom:18px;}
  .brand .logo{font-size:26px; font-weight:800; color:var(--pink-primary-dark);}
  .brand .sub{font-size:13px; color:var(--pink-accent); margin-top:2px;}
  .pageFooter{text-align:center; margin-top:22px; padding-top:16px; border-top:1px solid var(--pink-light);}
  .pageFooter .pfName{font-size:16px; font-weight:800; color:var(--pink-primary-dark);}
  .pageFooter .pfSub{font-size:13px; color:#475569; margin-top:4px;}
  .pageFooter .pfPhone{font-size:13px; color:#475569; margin-top:2px;}
  .card{
    background:#fff; border-radius:18px; padding:22px;
    box-shadow:0 8px 24px rgba(29,78,216,0.12);
    border:1px solid var(--pink-light);
    margin-bottom:16px;
  }
  h2.cardTitle{margin:0 0 14px; color:var(--pink-primary-dark); font-size:19px;}
  label{display:block; font-size:13px; font-weight:600; margin:12px 0 6px; color:var(--pink-text);}
  input[type=text], select, textarea{
    width:100%; padding:11px 13px; border-radius:10px;
    border:1.5px solid var(--pink-light); font-size:15px; background:var(--pink-lighter);
    color:var(--pink-text); font-family:inherit;
  }
  textarea{resize:vertical; min-height:70px;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--pink-primary);}
  .btn{
    display:inline-block; padding:12px 26px; border-radius:999px; border:none;
    background:linear-gradient(135deg,var(--pink-primary),var(--pink-accent));
    color:#fff; font-weight:700; font-size:15px; cursor:pointer;
    box-shadow:0 6px 16px rgba(29,78,216,0.3);
  }
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .btn.secondary{background:#fff; color:var(--pink-primary-dark); border:2px solid var(--pink-primary); box-shadow:none;}
  .btnRow{text-align:center; margin-top:18px;}
  .errMsg{color:var(--red); font-size:13px; margin-top:8px; font-weight:600;}
  #examScreen{display:none;}
  #resultOverlay{display:none; position:fixed; inset:0; background:rgba(30,58,138,0.55); z-index:50; overflow-y:auto;}
  #resultOverlay .card{max-width:760px; margin:30px auto;}
  .examHead{
    position:sticky; top:0; z-index:10; background:#fff; border-radius:18px;
    padding:14px 18px; margin-bottom:16px; box-shadow:0 6px 16px rgba(29,78,216,0.15);
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px;
    border:1px solid var(--pink-light);
  }
  .examHead .who{font-size:13px; line-height:1.5;}
  .examHead .who b{color:var(--pink-primary-dark);}
  .timer{font-size:20px; font-weight:800; color:var(--pink-primary-dark); background:var(--pink-lighter); padding:6px 14px; border-radius:12px;}
  .sectionTitle{
    font-size:20px; font-weight:800; color:#fff; background:linear-gradient(135deg,var(--pink-primary),var(--pink-accent));
    padding:10px 18px; border-radius:14px; margin:26px 0 14px;
  }
  .partHead{margin-bottom:12px;}
  .partHead .name{font-weight:700; color:var(--pink-primary-dark); font-size:16px;}
  .partLabel{display:inline-block; background:var(--pink-primary); color:#fff; font-weight:700; font-size:12px; padding:3px 12px; border-radius:999px; margin-bottom:8px;}
  .partHead .zh{font-weight:800; color:var(--pink-primary-dark); font-size:16px; line-height:1.4;}
  .partHead .desc{font-size:13px; color:#1e40af; margin-top:3px;}
  /* Dong tieu de nho danh dau ranh gioi tung khoi cau (vd "第1~5题") ben trong
     1 phan lon da chia nhieu khoi (nghe_p1, doc_p1, doc_p2). */
  .groupHead{font-weight:800; color:var(--pink-primary-dark); font-size:14px; margin:16px 0 8px; padding-top:14px; border-top:1px dashed var(--pink-light);}
  .groupHead:first-of-type{border-top:none; padding-top:0; margin-top:0;}
  .qBlock{border-top:1px dashed var(--pink-light); padding-top:14px; margin-top:14px;}
  .qBlock:first-child{border-top:none; padding-top:0; margin-top:0;}
  .qRow{display:flex; align-items:center; gap:10px; margin:10px 0; flex-wrap:wrap;}
  .qNum{font-weight:800; color:var(--pink-primary-dark); min-width:26px;}
  .qText{flex:1 1 100%; font-size:15px; margin-bottom:4px;}
  .bubbles{display:flex; gap:8px; flex-wrap:wrap;}
  .bubble{
    padding:9px 16px; border-radius:999px; border:2px solid var(--pink-light);
    background:#fff; cursor:pointer; font-weight:600; font-size:14px; color:#1e293b;
    transition:all .15s;
  }
  .bubble:hover{border-color:var(--pink-accent);}
  .bubble.selected{background:var(--pink-primary); border-color:var(--pink-primary); color:#fff;}
  .bubble.correct{background:#fff; border-color:var(--green); color:var(--green); font-weight:800;}
  .bubble.wrong{background:#fff; border-color:var(--red); color:var(--red); font-weight:800;}
  .imgPool{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
  .imgPoolItem img{display:block; width:100%; max-width:340px; height:auto; border-radius:10px; border:2px solid var(--pink-light);}
  .textPool{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; background:var(--pink-lighter); padding:12px; border-radius:12px;}
  .textPoolItem{background:#fff; border:1.5px solid var(--pink-light); border-radius:10px; padding:6px 12px; font-size:14px;}
  .textPoolItem b{color:var(--pink-primary-dark);}
  .passageBox{background:var(--pink-lighter); border-left:4px solid var(--pink-primary); padding:12px 14px; border-radius:10px; margin-bottom:10px; font-size:15px; line-height:1.6;}
  .blankMark{display:inline-block; min-width:34px; border-bottom:2px solid var(--pink-primary-dark); color:var(--pink-primary-dark); font-weight:800; text-align:center;}
  .vietP1Row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:16px; margin:10px 0;}
  .pinyinChip{background:#dbeafe; color:var(--pink-primary-dark); font-weight:700; padding:3px 10px; border-radius:8px; font-size:13px;}
  .vietP1Row input[type=text]{width:120px; display:inline-block; text-align:center; font-size:17px;}
  .vietP2Item{margin-bottom:18px;}
  .vietP2Item img{max-width:260px; width:100%; border-radius:10px; border:2px solid var(--pink-light); display:block; margin-bottom:8px;}
  .goiYChip{display:inline-block; background:var(--pink-primary); color:#fff; font-weight:700; padding:4px 12px; border-radius:999px; margin-bottom:8px; font-size:14px;}
  .audioBar{
    display:flex; align-items:center; gap:10px; background:var(--pink-lighter);
    border:1.5px solid var(--pink-light); border-radius:14px; padding:10px 14px; margin-bottom:12px; cursor:pointer;
  }
  .audioBar .label{font-weight:700; font-size:14px; flex:1;}
  .audioBar .sub{font-size:11px; color:#1e40af;}
  .audioBar .btn{padding:8px 16px; font-size:13px; box-shadow:none;}
  .audioBar.collapsed .audioTrack, .audioBar.collapsed .btn.replayBtn{display:none;}
  .expandHint{font-size:11px; color:#1e40af; font-style:italic;}
  .audioTrack{display:none;}
  .tbdNote{font-size:12px; color:#1e40af; font-style:italic; margin-top:6px;}
  .progressWrap{background:var(--pink-lighter); border-radius:999px; height:8px; overflow:hidden; margin:10px 0 4px;}
  .progressBar{height:100%; background:linear-gradient(90deg,var(--pink-primary),var(--pink-accent)); width:0%;}
  .scoreGrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0;}
  .scoreBox{background:var(--pink-lighter); border-radius:14px; padding:14px; text-align:center;}
  .scoreBox .num{font-size:26px; font-weight:800; color:var(--pink-primary-dark);}
  .scoreBox .lbl{font-size:12px; color:#1e40af; margin-top:2px;}
  .totalBox{background:linear-gradient(135deg,var(--pink-primary),var(--pink-accent)); color:#fff; border-radius:14px; padding:16px; text-align:center; margin:10px 0;}
  .totalBox .num{font-size:34px; font-weight:800;}
  .totalBox .lbl{font-size:13px; opacity:.9;}
  .noteBox{background:#fff7ed; border:1.5px solid #fdba74; border-radius:12px; padding:10px 14px; font-size:13px; color:#9a3412; margin:10px 0;}
  .vietP2Review{background:var(--pink-lighter); border-radius:10px; padding:10px 14px; margin-bottom:10px; font-size:14px;}
  .vietP2Review .mau{color:#065f46; font-style:italic; margin-top:4px;}
  #reviewList{background:#fbfcff; border-radius:14px; padding:6px 12px;}
  .reviewSectionTitle{font-weight:800; color:var(--pink-primary-dark); font-size:15px; margin:22px 0 4px; padding-bottom:6px;}
  .reviewSectionTitle:first-child{margin-top:6px;}
  .reviewItem{padding:16px 2px; margin-bottom:0; font-size:14px; background:transparent; border:none; border-top:1px dashed var(--pink-light); border-radius:0; box-shadow:none;}
  .reviewSectionTitle + .reviewItem{border-top:none;}
  .reviewItem .rHead{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; font-weight:700; color:#111827; margin-bottom:8px; font-size:14.5px;}
  .reviewItem .rAns{font-size:13px; margin-top:6px; color:#111827;}
  .reviewItem .rExplain{margin-top:10px; background:var(--pink-lighter); border-left:3px solid var(--pink-primary); padding:10px 12px; border-radius:8px; font-size:13px; color:var(--pink-text); line-height:1.5;}
  .reviewToggleBtn{margin-top:14px;}
  .rPrompt{font-size:14.5px; font-weight:700; margin-bottom:8px; color:#111827;}
  .rSentence{font-size:15px; margin-bottom:8px; color:#111827;}
  .rOptions{margin:6px 0 2px; display:flex; flex-direction:column; align-items:flex-start; gap:6px;}
  .rOptionRow{padding:8px 12px; border-radius:9px; font-size:13.5px; background:#fff; border:1.5px solid #e2e8f0; display:inline-flex; align-items:center; gap:8px; line-height:1.4; color:#111827; max-width:100%;}
  .rOptionRow.isCorrect{border-color:var(--green); background:#fff; font-weight:700; color:var(--green);}
  .rOptionRow.isChosen{border-color:var(--red); background:#fff; color:var(--red);}
  .badgeOk{background:var(--green); color:#fff; font-weight:800; font-size:12px; width:20px; height:20px; line-height:20px; text-align:center; border-radius:999px; display:inline-block; flex-shrink:0;}
  .badgeBad{background:var(--red); color:#fff; font-weight:800; font-size:12px; width:20px; height:20px; line-height:20px; text-align:center; border-radius:999px; display:inline-block; flex-shrink:0;}
  @media(max-width:520px){
    .scoreGrid{grid-template-columns:1fr;}
    .examHead{flex-direction:column; align-items:flex-start;}
  }
</style>
</head>
<body>
<div class="wrap">

      <button class="btn" id="btnSubmit">Nộp bài</button>
    </div>
  </div>
</div>

<div id="resultOverlay">
  <div class="card" id="resultCard"></div>
</div>

<audio id="playerNghe1" style="display:none"></audio>

<script>
// ================== CAU HINH ==================
var API_URL = 'https://script.google.com/macros/s/AKfycbySNdKrO4qxbxULLjF1y-M1rjmTsikEgWBlSticsvyY21T-dG3JW99e70Gxp_qxCeAx/exec';
var PENALTY_PER_REPLAY = 10; // tru diem Nghe (thang 100) neu bam nghe lai (chi 1 lan cho CA bai Nghe)

// ================== STATE ==================
var EXAM = null;
var STUDENT = { hoTen:'', maLop:'', lesson:null };
var ANSWERS = {};      // qid (= STT thuc te, 1~70 lien tuc toan bai) -> 'A'/'B'/'C'...
var VIET_P1_TEXT = {}; // qid -> cau hoc sinh dat (nhin tranh + tu goi y)
var VIET_P2_TEXT = ''; // doan van hoc sinh viet - HSK4 Viet P2 chi co 1 doan/1 Bai
var REPLAYED_SET = {};    // audioId -> true (audio Nghe DUY NHAT cua ca bai, chi duoc nghe lai 1 lan)
var REPLAYED_LABELS = []; // ten cac phan da bi bam nghe lai (de ghi vao KetQua)
var AUDIO_LABEL_MAP = {}; // audioId -> nhan (label) cua audio do
var TOTAL_QUESTIONS = 0;
var ANSWERED_SET = {};
var TIMER_SECS = 0;
var TIMER_HANDLE = null;
var LAST_RESULT = null; // luu ket qua sau khi nop bai, dung cho man hinh "Xem lai bai lam"

// ================== TIEN ICH ==================
function qs(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

function fetchJSON(url){
  return fetch(url).then(function(r){ return r.json(); });
}

function markAnswered(qid){
  if(!ANSWERED_SET[qid]){ ANSWERED_SET[qid] = true; updateProgress(); }
}
function updateProgress(){
  var done = Object.keys(ANSWERED_SET).length;
  var pct = TOTAL_QUESTIONS ? Math.round(done/TOTAL_QUESTIONS*100) : 0;
  qs('progressBar').style.width = pct + '%';
}

function bubbleRow(qid, options, kind, onPick){
  // options: array of letters (choice tu pool) hoac object {letter:text}
  var letters, getText;
  if(Array.isArray(options)){ letters = options; getText = function(l){ return l; }; }
  else { letters = Object.keys(options).filter(function(l){ return options[l]; }); getText = function(l){ return options[l]; }; }
  var html = '<div class="bubbles" data-qid="'+qid+'">';
  letters.forEach(function(L){
    var label = kind==='letter' ? L : (L+'. '+esc(getText(L)));
    html += '<div class="bubble" data-letter="'+L+'" onclick="pickAnswer(\''+qid+'\',\''+L+'\',this)">'+label+'</div>';
  });
  html += '</div>';
  return html;
}

function pickAnswer(qid, letter, el){
  ANSWERS[qid] = letter;
  var parent = el.parentElement;
  Array.prototype.forEach.call(parent.children, function(c){ c.classList.remove('selected'); });
  el.classList.add('selected');
  markAnswered(qid);
}

function poolTextBlock(pool){
  var letters = Object.keys(pool).filter(function(l){ return pool[l]; }).sort();
  var html = '<div class="textPool">';
  letters.forEach(function(L){
    html += '<div class="textPoolItem"><b>'+L+'.</b> '+esc(pool[L])+'</div>';
  });
  html += '</div>';
  return html;
}

// hien thi cau co cho trong dang gach chan (thay the "()"/"（）" bang o trong)
function renderBlankSentence(text){
  var t = String(text||'');
  return esc(t).replace(/[(（]\s*[)）]/, '<span class="blankMark">?</span>');
}

var audioSeq = 0;
function audioBarHtml(src, label){
  audioSeq++;
  var id = 'aud'+audioSeq;
  AUDIO_LABEL_MAP[id] = label;
  if(!src){
    return '<div class="audioBar"><div class="label">🔇 '+label+' (chưa có link audio)</div></div>';
  }
  return '<div class="audioBar" id="bar_'+id+'" onclick="onAudioBarClick(event,\''+id+'\')">'+
    '<div style="flex:1">'+
      '<div class="label">🔊 '+label+'</div>'+
      '<div class="sub" id="hint_'+id+'">Bấm để nghe (chỉ được nghe lại đúng 1 lần, nghe lại sẽ bị trừ '+PENALTY_PER_REPLAY+' điểm phần Nghe)</div>'+
    '</div>'+
    '<audio class="audioTrack" id="'+id+'" src="'+src+'" preload="none"></audio>'+
    '<button class="btn" onclick="event.stopPropagation(); startAudio(\''+id+'\')" id="playBtn_'+id+'">▶ Nghe</button>'+
    '<button class="btn secondary replayBtn" style="display:none" onclick="event.stopPropagation(); replayAudio(\''+id+'\')" id="replayBtn_'+id+'">🔁 Nghe lại (-'+PENALTY_PER_REPLAY+' điểm)</button>'+
  '</div>';
}

function toggleAudioBar(id, force){
  var bar = qs('bar_'+id);
  if(!bar) return;
  if(force===true) bar.classList.add('collapsed');
  else if(force===false) bar.classList.remove('collapsed');
  else bar.classList.toggle('collapsed');
}
function onAudioBarClick(ev, id){
  if(ev.target && ev.target.tagName==='BUTTON') return;
  toggleAudioBar(id);
}
function startAudio(id){
  var el = qs(id);
  if(!el) return;
  el.currentTime = 0;
  el.play();
  qs('playBtn_'+id).style.display='none';
  // chi hien nut "Nghe lai" neu audio nay CHUA tung duoc nghe lai lan nao
  var rb = qs('replayBtn_'+id);
  if(rb && !REPLAYED_SET[id]) rb.style.display='inline-block';
  toggleAudioBar(id, true);
}
function replayAudio(id){
  var el = qs(id);
  if(!el || REPLAYED_SET[id]) return; // da dung luot nghe lai duy nhat roi thi khong cho nghe them
  REPLAYED_SET[id] = true;
  REPLAYED_LABELS.push(AUDIO_LABEL_MAP[id] || id);
  el.currentTime = 0;
  el.play();
  toggleAudioBar(id, true);
  var rb = qs('replayBtn_'+id);
  if(rb){ rb.style.display = 'none'; rb.disabled = true; }
}

// ================== TAI DANH SACH BAI ==================
window.addEventListener('DOMContentLoaded', function(){
  fetchJSON(API_URL + '?action=lessons').then(function(res){
    var sel = qs('inLesson');
    if(!res.ok){ sel.innerHTML = '<option value="">Lỗi tải danh sách bài</option>'; return; }
    if(!res.data || !res.data.length){ sel.innerHTML = '<option value="">Chưa có bài nào</option>'; return; }
    sel.innerHTML = '<option value="">-- Chọn bài --</option>' + res.data.map(function(l){
      return '<option value="'+l+'">Bài '+l+'</option>';
    }).join('');
    checkSetupReady();
  }).catch(function(err){
    qs('inLesson').innerHTML = '<option value="">Không kết nối được hệ thống</option>';
    qs('setupErr').textContent = 'Lỗi tải dữ liệu: ' + err;
  });

  ['inHoTen','inMaLop','inLesson'].forEach(function(id){
    qs(id).addEventListener('input', checkSetupReady);
    qs(id).addEventListener('change', checkSetupReady);
  });
  qs('btnStart').addEventListener('click', startExam);
  qs('btnSubmit').addEventListener('click', submitExam);
});

function checkSetupReady(){
  var ok = qs('inHoTen').value.trim() && qs('inMaLop').value.trim() && qs('inLesson').value;
  qs('btnStart').disabled = !ok;
}

// ================== BAT DAU LAM BAI ==================
function startExam(){
  STUDENT.hoTen = qs('inHoTen').value.trim();
  STUDENT.maLop = qs('inMaLop').value.trim();
  STUDENT.lesson = qs('inLesson').value;
  qs('setupErr').textContent = '';
  qs('btnStart').disabled = true;
  qs('btnStart').textContent = 'Đang tải đề...';

  fetchJSON(API_URL + '?action=exam&bai=' + encodeURIComponent(STUDENT.lesson)).then(function(res){
    if(!res.ok){ throw new Error(res.error || 'Không tải được đề'); }
    EXAM = res.data;
    document.body.classList.add('examMode');
    qs('setupScreen').style.display = 'none';
    qs('examScreen').style.display = 'block';
    qs('showHoTen').textContent = STUDENT.hoTen;
    qs('showMaLop').textContent = STUDENT.maLop;
    qs('showLesson').textContent = STUDENT.lesson;
    renderExam();
    startTimer();
  }).catch(function(err){
    qs('setupErr').textContent = 'Lỗi: ' + err.message;
    qs('btnStart').disabled = false;
    qs('btnStart').textContent = 'Bắt đầu làm bài';
  });
}

function startTimer(){
  TIMER_SECS = 0;
  TIMER_HANDLE = setInterval(function(){
    TIMER_SECS++;
    var m = Math.floor(TIMER_SECS/60), s = TIMER_SECS%60;
    qs('timer').textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }, 1000);
}

// ================== RENDER DE THI ==================
function renderExam(){
  TOTAL_QUESTIONS = countQuestions();
  var html = '';

  html += '<div class="sectionTitle">🎧 Phần Nghe (32 câu)</div>';
  html += '<div class="card">' + renderNghe() + '</div>';

  html += '<div class="sectionTitle">📖 Phần Đọc (32 câu)</div>';
  html += '<div class="card">' + renderDocP1(EXAM.doc_p1) + '</div>';
  html += '<div class="card">' + renderDocP2(EXAM.doc_p2) + '</div>';
  html += '<div class="card">' + renderDocP3(EXAM.doc_p3) + '</div>';

  html += '<div class="sectionTitle">✍️ Phần Viết (6 câu)</div>';
  html += '<div class="card">' + renderVietP1(EXAM.viet_p1) + '</div>';
  html += '<div class="card">' + renderVietP2(EXAM.viet_p2) + '</div>';

  qs('sections').innerHTML = html;
}

// Nhan song ngu (Trung + dich Viet) cho tung phan - dong tren la tieu de tieng
// Trung (co kem so thu tu cau THUC TE lay tu du lieu, vi du "第33~42题"), dong
// duoi la ban dich/mo ta tieng Viet.
var PART_LABELS_ = {
  nghe_p1: { zh: '听录音，选择正确答案', vi: 'Nghe đoạn hội thoại/câu ngắn, chọn đáp án đúng.' },
  nghe_p2: { zh: '听录音，选择正确答案', vi: 'Nghe đoạn hội thoại/đoạn nói dài hơn, chọn đáp án đúng.' },
  doc_p1:  { zh: '选词填空', vi: 'Chọn từ phù hợp điền vào chỗ trống "()" trong câu.' },
  doc_p2:  { zh: '阅读短文，选择正确答案', vi: 'Đọc đoạn văn ngắn, chọn đáp án đúng.' },
  doc_p3:  { zh: '阅读短文，选择合适的词语/句子填空', vi: 'Đọc đoạn văn có nhiều chỗ trống đánh số, chọn câu/từ phù hợp điền vào mỗi chỗ trống.' },
  viet_p1: { zh: '看图片和词语，写句子', vi: 'Nhìn tranh và từ gợi ý, viết 1 câu hoàn chỉnh. Giáo viên sẽ chấm trực tiếp, không chấm tự động.' },
  viet_p2: { zh: '看题目，写短文', vi: 'Viết 1 đoạn văn ngắn (tối thiểu 80 chữ) theo chủ đề cho sẵn. Giáo viên sẽ chấm trực tiếp, không chấm tự động.' }
};
function rangeLabel_(items){
  if(!items || !items.length) return '';
  var first = items[0].id, last = items[items.length-1].id;
  return first===last ? String(first) : (first+'~'+last);
}
// Dong tieu de nho danh dau ranh gioi tung khoi cau (vd "第1~5题"), dat ngay
// truoc anh/bang dap an cua khoi do - giup phan biet ro khoi nay voi khoi ke
// tiep khi 1 phan lon duoc chia thanh nhieu khoi (nghe_p1, doc_p1, doc_p2).
function groupHeadHtml_(items){
  var range = rangeLabel_(items);
  return range ? '<div class="groupHead">第'+esc(range)+'题</div>' : '';
}
function partHeadHtml_(key, items, partLabel){
  var lab = PART_LABELS_[key] || { zh:'', vi:'' };
  var range = rangeLabel_(items);
  var zh = (range ? ('第'+range+'题：') : '') + lab.zh;
  var labelHtml = partLabel ? '<div class="partLabel">'+esc(partLabel)+'</div>' : '';
  return '<div class="partHead">'+labelHtml+'<div class="zh">'+esc(zh)+'</div><div class="desc">'+esc(lab.vi)+'</div></div>';
}

function countQuestions(){
  var n = 0;
  ['nghe_p1','nghe_p2','doc_p1','doc_p2','doc_p3','viet_p1'].forEach(function(k){
    if(EXAM[k] && EXAM[k].items) n += EXAM[k].items.length;
  });
  n += 1; // Viet P2 - 1 doan van / 1 Bai, tinh la 1 "cau" cho thanh progress
  return n;
}

// Nghe_P1 + Nghe_P2 dung CHUNG 1 audio DUY NHAT cho ca phan Nghe cua 1 Bai -
// chi hien 1 audioBar o dau phan, roi liet ke tiep 第一部分 / 第二部分 ben duoi.
function renderNghe(){
  var h = '';
  h += audioBarHtml(EXAM.linkAudio, 'Audio phần Nghe (toàn bộ 32 câu)');
  h += partHeadHtml_('nghe_p1', EXAM.nghe_p1.items, '第一部分');
  (EXAM.nghe_p1.items||[]).forEach(function(it){
    h += '<div class="qBlock"><div class="qRow"><span class="qNum">'+it.id+'.</span>' + bubbleRow(it.id, it.options||{}, 'text') + '</div></div>';
  });
  h += partHeadHtml_('nghe_p2', EXAM.nghe_p2.items, '第二部分');
  (EXAM.nghe_p2.items||[]).forEach(function(it){
    h += '<div class="qBlock"><div class="qRow"><span class="qNum">'+it.id+'.</span>' + bubbleRow(it.id, it.options||{}, 'text') + '</div></div>';
  });
  return h;
}

// Doc_P1: chon tu dien cho trong "()" trong cau - tung khoi 5 cau dung chung
// 1 pool tu (toi da 6 tu A-F, tu dong theo dung cot Sheet co dien).
function renderDocP1(part){
  var h = partHeadHtml_('doc_p1', part.items);
  (part.groups||[]).forEach(function(g){
    h += groupHeadHtml_(g.items);
    h += poolTextBlock(g.pool||{});
    var letters = Object.keys(g.pool||{}).filter(function(l){ return g.pool[l]; });
    (g.items||[]).forEach(function(it){
      h += '<div class="qRow"><span class="qText">'+it.id+'. '+renderBlankSentence(it.text)+'</span></div>';
      h += '<div class="qRow" style="margin-top:-4px">' + bubbleRow(it.id, letters, 'letter') + '</div>';
    });
  });
  return h;
}

// Doc_P2: doc hieu doan van - cac dong LIEN TIEP dung chung 1 doan van (da
// duoc server tu gop san trong "groups") hien doan van 1 lan, cau hoi + 4-6
// lua chon rieng cho tung cau ben duoi.
function renderDocP2(part){
  var h = partHeadHtml_('doc_p2', part.items);
  (part.groups||[]).forEach(function(g){
    h += groupHeadHtml_(g.items);
    if(g.passage) h += '<div class="passageBox">'+esc(g.passage)+'</div>';
    (g.items||[]).forEach(function(it){
      h += '<div class="qBlock">';
      h += '<div class="qRow"><span class="qNum">'+it.id+'.</span><span class="qText" style="flex:1">'+esc(it.question)+'</span></div>';
      h += '<div class="qRow">' + bubbleRow(it.id, it.options||{}, 'text') + '</div>';
      h += '</div>';
    });
  });
  return h;
}

// Doc_P3: 1 doan van co nhieu cho trong danh so (58)(59)... dung chung 1 POOL
// lua chon (chi chu cai, khong co noi dung rieng tung cau) - server da gop
// san tung khoi ("groups") theo dung doan van lap lai o cac dong lien tiep.
function renderDocP3(part){
  var h = partHeadHtml_('doc_p3', part.items);
  (part.groups||[]).forEach(function(g){
    h += groupHeadHtml_(g.items);
    if(g.passage) h += '<div class="passageBox">'+esc(g.passage)+'</div>';
    h += poolTextBlock(g.pool||{});
    var letters = Object.keys(g.pool||{}).filter(function(l){ return g.pool[l]; });
    (g.items||[]).forEach(function(it){
      h += '<div class="qRow"><span class="qNum">Chỗ trống ('+it.id+'):</span>' + bubbleRow(it.id, letters, 'letter') + '</div>';
    });
  });
  return h;
}

// Viet_P1: nhin tranh + tu goi y, go 1 cau hoan chinh - KHONG cham tu dong,
// giao vien doc va cham tay (luu nguyen vao KetQua). Khong hien cot "Cau mau"
// cho hoc sinh thay, du backend co tra ve - cot do chi de giao vien tham khao.
function renderVietP1(part){
  var h = partHeadHtml_('viet_p1', part.items, '第一部分');
  (part.items||[]).forEach(function(it){
    h += '<div class="vietP2Item">';
    h += '<div class="qNum">Câu '+it.id+'</div>';
    if(it.image) h += '<img src="'+it.image+'" alt="Ảnh gợi ý">';
    if(it.goiY) h += '<div class="goiYChip">Từ gợi ý: '+esc(it.goiY)+'</div>';
    h += '<textarea placeholder="Viết câu của bạn ở đây..." oninput="onVietP1Input('+it.id+',this.value)"></textarea>';
    h += '</div>';
  });
  return h;
}
function onVietP1Input(qid, val){
  VIET_P1_TEXT[qid] = val;
  markAnswered(qid);
}

// Viet_P2: 1 de bai duy nhat / 1 Bai, hoc sinh viet 1 doan van (toi thieu 80
// chu) - KHONG cham tu dong, giao vien doc va cham tay.
function renderVietP2(part){
  var h = partHeadHtml_('viet_p2', [], '第二部分');
  h += '<div class="vietP2Item">';
  h += '<div class="qNum">Đề bài: '+esc(part.deBai || '(chưa có đề bài trong Sheet)')+'</div>';
  h += '<textarea id="vietP2Box" rows="8" placeholder="Viết đoạn văn của bạn ở đây (tối thiểu 80 chữ)..." oninput="onVietP2Input(this.value)"></textarea>';
  h += '<div class="tbdNote" id="vietP2Count">0 chữ (tối thiểu 80 chữ)</div>';
  h += '</div>';
  return h;
}
function onVietP2Input(val){
  VIET_P2_TEXT = val;
  var n = val.replace(/\s/g,'').length;
  qs('vietP2Count').textContent = n + ' chữ (tối thiểu 80 chữ)' + (n>=80?' ✅':'');
  markAnswered('vietP2');
}

// ================== CHAM DIEM & NOP BAI ==================
// HSK4: chi Nghe + Doc duoc tu cham (thang 100/moi ky nang). Viet (P1 + P2)
// KHONG tu cham - luu nguyen bai lam de giao vien doc va dien diem tay vao
// KetQua (cot H/I), dung y het lua chon da chot voi nguoi dung khi thiet ke
// he thong nay.
function computeScore(){
  var ngheTotal = (EXAM.nghe_p1.items.length + EXAM.nghe_p2.items.length) || 1;
  var docTotal = (EXAM.doc_p1.items.length + EXAM.doc_p2.items.length + EXAM.doc_p3.items.length) || 1;

  var ngheCorrect = 0, docCorrect = 0;
  var detail = {};

  [EXAM.nghe_p1, EXAM.nghe_p2].forEach(function(part){
    part.items.forEach(function(it){
      var chosen = ANSWERS[it.id] || '';
      var ok = it.answer && chosen === it.answer;
      if(ok) ngheCorrect++;
      detail[it.id] = { chosen: chosen, answer: it.answer, ok: ok, skill:'nghe' };
    });
  });
  [EXAM.doc_p1, EXAM.doc_p2, EXAM.doc_p3].forEach(function(part){
    part.items.forEach(function(it){
      var chosen = ANSWERS[it.id] || '';
      var ok = it.answer && chosen === it.answer;
      if(ok) docCorrect++;
      detail[it.id] = { chosen: chosen, answer: it.answer, ok: ok, skill:'doc' };
    });
  });

  var ngheRaw = Math.round(ngheCorrect/ngheTotal*100);
  var ngheScore = Math.max(0, ngheRaw - REPLAYED_LABELS.length*PENALTY_PER_REPLAY);
  var docScore = Math.round(docCorrect/docTotal*100);

  var vietP1 = EXAM.viet_p1.items.map(function(it){
    return { id: it.id, goiY: it.goiY, text: (VIET_P1_TEXT[it.id]||'').trim() };
  });

  return {
    ngheScore: ngheScore, docScore: docScore, detail: detail,
    vietP1: vietP1, vietP2: (VIET_P2_TEXT||'').trim(),
    replayedParts: REPLAYED_LABELS.slice()
  };
}

function submitExam(){
  if(TIMER_HANDLE) clearInterval(TIMER_HANDLE);
  var result = computeScore();
  qs('btnSubmit').disabled = true;
  qs('btnSubmit').textContent = 'Đang nộp bài...';

  var payload = {
    hoTen: STUDENT.hoTen, maLop: STUDENT.maLop, lesson: STUDENT.lesson,
    ngheScore: result.ngheScore, docScore: result.docScore,
    replayedParts: result.replayedParts, detail: result.detail,
    vietP1: result.vietP1, vietP2: result.vietP2
  };

  // Code_HSK4.gs doPost doi dung dang {action:'submit', payload:{...}} (khac
  // voi mot vai he thong HSK truoc gui payload truc tiep) - PHAI boc dung
  // dang nay thi Apps Script moi nhan va ghi vao Sheet.
  fetch(API_URL, { method:'POST', body: JSON.stringify({ action:'submit', payload: payload }) })
    // Không chặn UI nếu lỗi (bài đã chấm xong ở phía học sinh), nhưng PHẢI đọc
    // JSON trả về để biết máy chủ (Apps Script) có thực sự ghi được vào Sheet
    // hay không.
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(!res || !res.ok){
        console.error('Nộp bài thất bại phía máy chủ:', res && res.error);
        result.submitFailed = true;
      }
    })
    .catch(function(err){
      console.error('Loi nop bai', err);
      result.submitFailed = true;
    })
    .then(function(){ showResult(result); });
}

function showResult(result){
  markAllAnswers(result);
  var html = '<h2 class="cardTitle">🎉 Đã nộp bài</h2>';
  if(result.submitFailed){
    html += '<div class="errMsg" style="background:#fee2e2; border:1.5px solid var(--red); border-radius:10px; padding:10px 14px; margin-bottom:12px;">⚠️ Chưa lưu được kết quả vào hệ thống (lỗi kết nối/máy chủ). Vui lòng chụp lại màn hình điểm này và báo cho giáo viên.</div>';
  }
  html += '<div class="scoreGrid">';
  html += '<div class="scoreBox"><div class="num">'+result.ngheScore+'</div><div class="lbl">Điểm Nghe (/100)</div></div>';
  html += '<div class="scoreBox"><div class="num">'+result.docScore+'</div><div class="lbl">Điểm Đọc (/100)</div></div>';
  html += '</div>';
  html += '<div class="totalBox"><div class="num">'+(result.ngheScore+result.docScore)+' / 200</div><div class="lbl">Tổng điểm Nghe + Đọc</div></div>';
  html += '<div class="noteBox">📝 Phần Viết (Viết P1 + Viết P2) đã được lưu lại đầy đủ vào hệ thống. Giáo viên sẽ đọc và chấm điểm tay, điểm tổng cả bài (Nghe + Đọc + Viết) sẽ được cập nhật sau trong bảng điểm.' +
    (result.replayedParts.length ? '<br>🔁 Đã bấm nghe lại: ' + esc(result.replayedParts.join(', ')) + ' (bị trừ '+PENALTY_PER_REPLAY+' điểm phần Nghe).' : '') +
    '</div>';

  html += '<h2 class="cardTitle" style="margin-top:20px">Bài viết của bạn</h2>';
  html += '<div class="reviewSectionTitle">Viết – Phần 1</div>';
  result.vietP1.forEach(function(v){
    html += '<div class="vietP2Review"><b>Câu '+v.id+'</b> (từ gợi ý: '+esc(v.goiY)+')<br>' + (v.text ? esc(v.text) : '<i>(chưa viết)</i>') + '</div>';
  });
  html += '<div class="reviewSectionTitle">Viết – Phần 2</div>';
  html += '<div class="vietP2Review">' + (result.vietP2 ? esc(result.vietP2) : '<i>(chưa viết)</i>') + '</div>';

  html += '<div class="btnRow reviewToggleBtn"><button class="btn secondary" id="btnToggleReview" onclick="toggleReview()">📋 Xem lại bài làm và đáp án (Nghe + Đọc)</button></div>';
  html += '<div id="reviewList" style="display:none"></div>';
  html += '<div class="btnRow"><button class="btn" onclick="location.reload()">Làm bài khác</button></div>';
  qs('resultCard').innerHTML = html;
  qs('resultOverlay').style.display = 'block';
  LAST_RESULT = result;
}

function toggleReview(){
  var box = qs('reviewList');
  var btn = qs('btnToggleReview');
  var showing = box.style.display !== 'none';
  if(showing){
    box.style.display = 'none';
    btn.textContent = '📋 Xem lại bài làm và đáp án';
  } else {
    if(!box.dataset.filled){ box.innerHTML = buildReviewHtml(LAST_RESULT); box.dataset.filled = '1'; }
    box.style.display = 'block';
    btn.textContent = '🔼 Ẩn bài làm và đáp án';
  }
}

// Khung 1 the review: icon dung/sai, noi dung cau (bodyHtml tuy loai cau), va giai thich
// (hien LUON neu co, khong chi rieng cau sai - de hoc sinh xem lai ca cau dung).
function reviewItemHtml(no, ok, bodyHtml, giaiThich){
  var cls = ok ? 'ok' : 'bad';
  var icon = ok ? '✅' : '❌';
  var html = '<div class="reviewItem '+cls+'">';
  html += '<div class="rHead"><span>'+icon+' Câu '+no+'</span></div>';
  html += bodyHtml;
  if(!ok && giaiThich) html += '<div class="rExplain">💡 Giải thích: '+esc(giaiThich)+'</div>';
  html += '</div>';
  return html;
}

// Hien day du cac lua chon (chu + noi dung), to mau xanh o dap an dung, mau do o dap an
// hoc sinh chon sai - giup hoc sinh nho lai toan bo noi dung cau hoi, khong chi 1 dap an.
function optionsReviewHtml(options, chosen, correct){
  var letters = Object.keys(options||{}).filter(function(l){ return options[l]; });
  var html = '<div class="rOptions">';
  letters.forEach(function(L){
    var cls = 'rOptionRow';
    var badge = '';
    if(L===correct){ cls += ' isCorrect'; badge = ' <span class="badgeOk">✓</span>'; }
    else if(L===chosen){ cls += ' isChosen'; badge = ' <span class="badgeBad">✗</span>'; }
    html += '<div class="'+cls+'">'+L+'. '+esc(options[L])+badge+'</div>';
  });
  if(!chosen) html += '<div class="rAns">(Bạn chưa chọn đáp án)</div>';
  html += '</div>';
  return html;
}

// GIONG HET kieu bubble tron luc lam bai that (bubbleRow) - dung chung cho Nghe Phan 1
// (options la mang chu cai, kind='letter') va Nghe Phan 2/3 (options la {letter:text},
// kind='text') - khong con hien day du danh sach nhu Doc nua, cho gon/sang giong mau em gui.
function bubbleReviewHtml(options, chosen, correct, kind){
  var letters, getText;
  if(Array.isArray(options)){ letters = options; getText = function(l){ return l; }; }
  else { letters = Object.keys(options||{}).filter(function(l){ return options[l]; }); getText = function(l){ return options[l]; }; }
  var html = '<div class="bubbles">';
  letters.forEach(function(L){
    var cls = 'bubble';
    var mark = '';
    if(L===correct){ cls += ' correct'; mark = ' <span class="badgeOk">✓</span>'; }
    else if(L===chosen){ cls += ' wrong'; mark = ' <span class="badgeBad">✗</span>'; }
    var label = kind==='text' ? (L+'. '+esc(getText(L))) : L;
    html += '<div class="'+cls+'">'+label+mark+'</div>';
  });
  html += '</div>';
  if(!chosen) html += '<div class="rAns">(Bạn chưa chọn đáp án)</div>';
  return html;
}

// HSK4 chi "xem lai" Nghe + Doc (co dap an dung/sai ro rang) - Viet khong
// cham tu dong nen khong thuoc review nay, da hien rieng o "Bài viết của bạn".
function buildReviewHtml(result){
  var h = '';

  h += '<div class="reviewSectionTitle">Nghe – Phần 1</div>';
  EXAM.nghe_p1.items.forEach(function(it){
    var chosen = ANSWERS[it.id] || '';
    var ok = !!(it.answer && chosen === it.answer);
    h += reviewItemHtml(it.id, ok, bubbleReviewHtml(it.options, chosen, it.answer, 'text'), it.giaiThich);
  });

  h += '<div class="reviewSectionTitle">Nghe – Phần 2</div>';
  EXAM.nghe_p2.items.forEach(function(it){
    var chosen = ANSWERS[it.id] || '';
    var ok = !!(it.answer && chosen === it.answer);
    h += reviewItemHtml(it.id, ok, bubbleReviewHtml(it.options, chosen, it.answer, 'text'), it.giaiThich);
  });

  h += '<div class="reviewSectionTitle">Đọc – Phần 1</div>';
  (EXAM.doc_p1.groups||[]).forEach(function(g){
    h += groupHeadHtml_(g.items);
    (g.items||[]).forEach(function(it){
      var chosen = ANSWERS[it.id] || '';
      var ok = !!(it.answer && chosen === it.answer);
      var body = '<div class="rPrompt">'+renderBlankSentence(it.text)+'</div>';
      body += optionsReviewHtml(g.pool, chosen, it.answer);
      h += reviewItemHtml(it.id, ok, body, it.giaiThich);
    });
  });

  h += '<div class="reviewSectionTitle">Đọc – Phần 2</div>';
  (EXAM.doc_p2.groups||[]).forEach(function(g){
    h += groupHeadHtml_(g.items);
    var passageHtml = g.passage ? '<div class="passageBox">'+esc(g.passage)+'</div>' : '';
    (g.items||[]).forEach(function(it, idx){
      var chosen = ANSWERS[it.id] || '';
      var ok = !!(it.answer && chosen === it.answer);
      var body = (idx===0 ? passageHtml : '') + '<div class="rPrompt">'+esc(it.question)+'</div>';
      body += optionsReviewHtml(it.options, chosen, it.answer);
      h += reviewItemHtml(it.id, ok, body, it.giaiThich);
    });
  });

  h += '<div class="reviewSectionTitle">Đọc – Phần 3</div>';
  (EXAM.doc_p3.groups||[]).forEach(function(g){
    h += groupHeadHtml_(g.items);
    var passageHtml = g.passage ? '<div class="passageBox">'+esc(g.passage)+'</div>' : '';
    (g.items||[]).forEach(function(it, idx){
      var chosen = ANSWERS[it.id] || '';
      var ok = !!(it.answer && chosen === it.answer);
      var body = (idx===0 ? passageHtml : '') + optionsReviewHtml(g.pool, chosen, it.answer);
      h += reviewItemHtml(it.id, ok, body, it.giaiThich);
    });
  });

  return h;
}

function markAllAnswers(result){
  Object.keys(result.detail).forEach(function(qid){
    var d = result.detail[qid];
    var group = document.querySelector('.bubbles[data-qid="'+qid+'"]');
    if(!group) return;
    Array.prototype.forEach.call(group.children, function(b){
      var L = b.getAttribute('data-letter');
      if(L === d.answer) b.classList.add('correct');
      else if(L === d.chosen && !d.ok) b.classList.add('wrong');
    });
  });
}
